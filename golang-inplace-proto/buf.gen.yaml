version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: git.pangu.datalab/{{user}}/{{project_name}}/{{name}}/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-gorm
    out: gen
    opt:
      - paths=source_relative
