syntax = "proto3";

package user.v1;

import "gorm/options.proto";

message User {
  // 开启 GORM 支持
  option (gorm.opts).ormable = true;

  // 使用 gorm.field 指定数据库标签
  uint64 id = 1 [(gorm.field).tag = {primary_key: true, auto_increment: true}];
  string username = 2 [(gorm.field).tag = {unique: true, size: 100}];
  string email = 3;
  int32 age = 4;
}
