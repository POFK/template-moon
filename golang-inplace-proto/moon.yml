layer: 'library'
language: 'go'

stack: 'infrastructure'
tags:
  - 'server'
  - 'go'
  - 'proto'

project:
  name: '{{name}}'
  channel: '#golang'
  owner: 'tx.mao'
  maintainers: ['tx.mao']

fileGroups:
  sources:
    - '**/*.go'
    - 'go.mod'
    - 'go.sum'
  tests:
    - '**/*_test.go'
  proto:
    - 'proto/**/*.proto'
  proto-config:
    - 'buf.yaml'
    - 'buf.gen.yaml'

tasks:
  test:
    command: 'go test -v ./...'
    inputs:
      - '@group(sources)'
      - '@group(tests)'

  test-race:
    command: 'go test -race ./...'
    inputs:
      - '@group(sources)'
      - '@group(tests)'

  test-coverage:
    command: 'go test -cover ./...'
    inputs:
      - '@group(sources)'
      - '@group(tests)'

  lint:
    command: 'go fmt ./...'
    inputs:
      - '@group(sources)'

  tidy:
    command: 'go mod tidy'
    inputs:
      - 'go.mod'
      - 'go.sum'

  pre-install-go-protogengorm:
    toolchain: 'go'
    command: 'go install github.com/infobloxopen/protoc-gen-gorm@latest'
    env:
      GOBIN: "$workspaceRoot/.bin"
    inputs:
      - "moon.yml"
    outputs:
      - "/.bin/protoc-gen-gorm"

  pre-install-go-protogengo:
    toolchain: 'go'
    command: 'go install google.golang.org/protobuf/cmd/protoc-gen-go@latest'
    env:
      GOBIN: "$workspaceRoot/.bin"
    inputs:
      - "moon.yml"
    outputs:
      - "/.bin/protoc-gen-go"


  proto-install-tools:
    deps:
      - '~:pre-install-go-protogengorm'
      - '~:pre-install-go-protogengo'

  proto-generate:
    deps:
      - 'proto-install-tools'
    command: 'buf generate'
    inputs:
      - '@group(proto)'
      - '@group(proto-config)'
      - 'third_party/**/*.proto'
    outputs:
      - 'internal/gen/**/*'

  proto-clean:
    command: 'rm -rf internal/gen'

  build:
    command: 'go build -v ./...'
    inputs:
      - '@group(sources)'

  build-debug:
    command: 'go build -v ./...'
    inputs:
      - '@group(sources)'

  build-release:
    command: "go build -ldflags='-w -s' -v ./..."
    inputs:
      - '@group(sources)'

  check:
    deps:
      - 'lint'
      - 'test'
      - 'proto-generate'
