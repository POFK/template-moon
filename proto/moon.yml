stack: 'infrastructure'
layer: 'library'
tags:
  - 'proto'
  - 'api'

project:
  name: '{{name}}'
  channel: '#proto'
  owner: 'tx.mao'
  maintainers: ['tx.mao']

fileGroups:
  sources:
    - "moon.yml"
    - 'proto/**/*'
    - 'buf.gen.yaml'
    - 'buf.yaml'

tasks:
  pre-install-py-deps:
    toolchain: 'unstable_python' 
    command: 'uv sync'
    inputs:
      - "moon.yml"
      - 'pyproject.toml' # 触发 Python 环境检查
      - 'uv.lock' # 触发 Python 环境检查

  pre-install-go-deps:
    toolchain: 'go'
    command: 'go install github.com/infobloxopen/protoc-gen-gorm@latest'
    env:
      GOBIN: "$workspaceRoot/.bin"
    inputs:
      - "moon.yml"
    outputs:
      - "/.bin/protoc-gen-gorm"

  generate-only:
    deps:
      - '~:pre-install-py-deps'
      - '~:pre-install-go-deps'
    script: >
      export PATH=$workspaceRoot/.bin:$PATH &&
      buf generate -o ../ 
    inputs:
      - '@group(sources)'
    outputs:
      - '/proto/gen'

  generate:
    deps:
      - '~:pre-install-py-deps'
      - '~:pre-install-go-deps'
    script: >
      export PATH=$workspaceRoot/.bin:$PATH &&
      buf generate -o ../ &&
      cd $workspaceRoot/proto/gen/go &&
      go mod init github.com/POFK/{{project}}/proto &&
      go mod tidy &&
      cd - &&
      echo "Done"
    inputs:
      - '@group(sources)'
    outputs:
      - '/proto/gen'
